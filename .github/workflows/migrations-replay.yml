# Replay every migration from an empty database.
#
# The preview baseline exists so a from-scratch replay reaches the end, and
# nobody ran it from scratch until four agents in parallel found four
# production-only objects it was missing (docs/local-rig.md). This job is the
# gate: if the replay stops, the PR is red before anyone builds on the schema.
name: migrations-replay

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations-replay.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Keep the stack's ports out of the ephemeral range
        # 54320-54329 sit inside Linux's ephemeral range (32768-60999), so one
        # of the dozen parallel image pulls could take 54322 as its outbound
        # source port and the db container then failed with "address already
        # in use". Reserved ports are never handed out as source ports.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - name: Start a local stack and replay all migrations
        run: |
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
          supabase db reset
      - name: Every migration file is recorded as applied
        # Ask the CLI for the URL: supabase/config.toml is gitignored, so CI
        # runs on the default ports, not the local rig's 55422.
        run: |
          eval "$(supabase status -o env | grep '^DB_URL=')"
          applied=$(psql "$DB_URL" -Atc "select count(*) from supabase_migrations.schema_migrations")
          files=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
          echo "applied=$applied files=$files"
          test "$applied" = "$files"
      - name: Stop
        if: always()
        run: supabase stop --no-backup
