name: Playwright E2E

# MANUAL ONLY, on purpose. This job (npm ci + browser download + full build +
# whole Playwright suite, ~15-30 min) used to run on EVERY push to main and
# every PR - it was the single biggest consumer of the Actions minutes budget,
# and it duplicated work that now runs on the Mac before a push can happen:
# .husky/pre-push runs the production build plus the critical-path smoke specs
# on every push, and the full suite stays a local command (`npm run test:e2e`).
#
# Nothing triggers this automatically anymore. To run it in the cloud (e.g.
# once minutes exist again, before a launch): GitHub > Actions > Playwright
# E2E > "Run workflow". `paths` filtering does not apply to workflow_dispatch,
# which is fine - a manual run is always intentional.
on:
  workflow_dispatch:

# If it is dispatched twice, the newer run cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Stub the generated types that next build produces so tsc references work.
      - run: mkdir -p .next/types && touch .next/types/routes.d.ts

      - run: npx playwright install --with-deps chromium

      # Build via the SAME script `npm run test:e2e` uses locally, so the env
      # this suite needs is defined once (scripts/test-build.sh) rather than
      # here and there. Local runs had no equivalent for a long time, and the
      # resulting failures looked like product regressions.
      - name: Build Next.js
        run: npm run test:build

      # Run Playwright against `next start`. playwright.config.ts's webServer
      # block spawns the server when TEST_URL is unset.
      #
      # The local binary, not `npx playwright`: `npx` would answer a broken
      # install by fetching Playwright from the registry and running a version
      # whose browsers this job never downloaded. Not `npm test` either - that
      # script pins E2E_STUB_BACKEND, and CI deliberately pins the same skip set
      # via `CI` below (see tests/helpers/liveBackend.ts).
      - name: Run Playwright
        run: ./node_modules/.bin/playwright test --project=chromium
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
