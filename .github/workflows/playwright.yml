name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Stub the generated types that next build produces so tsc references work.
      - run: mkdir -p .next/types && touch .next/types/routes.d.ts

      - run: npx playwright install --with-deps chromium

      # Build via the SAME script `npm run test:e2e` uses locally, so the env
      # this suite needs is defined once (scripts/test-build.sh) rather than
      # here and there. Local runs had no equivalent for a long time, and the
      # resulting failures looked like product regressions.
      - name: Build Next.js
        run: npm run test:build

      # Run Playwright against `next start`. playwright.config.ts's webServer
      # block spawns the server when TEST_URL is unset.
      - name: Run Playwright
        run: npx playwright test --project=chromium
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
