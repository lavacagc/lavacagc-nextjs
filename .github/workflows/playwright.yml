name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Stub the generated types that next build produces so tsc references work.
      - run: mkdir -p .next/types && touch .next/types/routes.d.ts

      - run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build
        env:
          # Public reCAPTCHA site key is only referenced client-side — a placeholder
          # unblocks the build; tests stub window.grecaptcha so no real verify runs.
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "test-placeholder-site-key"
          # Public Supabase URL is baked into the client bundle. A placeholder is
          # fine for the build; tests never hit Supabase (they stub/intercept).
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

      # Run Playwright against `next start`. playwright.config.ts's webServer
      # block spawns the server when TEST_URL is unset.
      - name: Run Playwright
        run: npx playwright test --project=chromium
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
