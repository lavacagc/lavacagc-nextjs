name: Chaos runners

# Tier 1 (static invariants) now runs in ci.yml on every PR and push to main.
# This workflow keeps the two heavier tiers, run on demand:
#
#   Tier 2  isolation + budget  needs a build + chromium
#   Tier 3  crawl               needs a build + long crawl
#
# Phase 4 (docs/home-care-audit.md) schedules them nightly with the e2e suite.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier to run'
        required: true
        default: 'tier2'
        type: choice
        options: [tier2, tier3]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: 'Tier 2 - isolation + budget'
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'tier2'
    # Pinned: ubuntu-latest is 26.04, which Playwright 1.57 cannot install
    # chromium on. Move to ubuntu-latest once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p .next/types && touch .next/types/routes.d.ts
      - run: npx playwright install --with-deps chromium
      - name: Build (same script the local suite uses)
        run: npm run test:build
      - name: Isolation + budget suites
        run: ./node_modules/.bin/playwright test --project=chromium --grep "@isolation|@budget"
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-tier2-report
          path: playwright-report/
          retention-days: 7

  # --- Tier 3 -------------------------------------------------------------
  # The coverage crawl: every route as anonymous and as admin, asserting no
  # 404, no 5xx, no uncaught error, no error leak, and - the output worth
  # reading - which routes nothing links to.
  crawl:
    name: 'Tier 3 - coverage crawl'
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'tier3'
    # Pinned: ubuntu-latest is 26.04, which Playwright 1.57 cannot install
    # chromium on. Move to ubuntu-latest once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p .next/types && touch .next/types/routes.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:build
      - name: Crawl every route as every role
        run: ./node_modules/.bin/playwright test tests/chaos/crawler.spec.ts --project=chromium
        env:
          CI: 'true'
      - name: Upload crawl output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-crawl
          path: chaos/crawl-*.json
          retention-days: 14
